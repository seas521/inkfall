<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="water-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7e6" stop-opacity="0.22"/>
      <stop offset="0.12" stop-color="#ced2d1" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#9ba1a1" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#62696b" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="surface-glow" x1="0" y1="0" x2="1" y2="0">
